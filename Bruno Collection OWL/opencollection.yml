opencollection: 1.0.0

info:
  name: Bruno Collection OWL
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: before-request
      code: |-
        // Retrieve the cookie string we stored during login
        const authCookie = bru.getVar('savedAuthCookie');

        if (authCookie) {
          // Inject the cookie header directly into this outgoing request
          req.setHeader('Cookie', authCookie);
        }
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
