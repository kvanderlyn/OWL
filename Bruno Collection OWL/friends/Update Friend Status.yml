info:
  name: Update Friend Status
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/friends/update-friend-request"
  body:
    type: json
    data: |-
      {
        "id": "{{friendId}}",
        "isApproved": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
