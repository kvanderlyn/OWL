info:
  name: Check username
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/auth/is-username-available
  body:
    type: json
    data: |-
      {
        "username": "test"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
